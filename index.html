<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegant Todo App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        overflow: hidden;
      }

      .sidebar {
        width: 320px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        border-right: 1px solid rgba(255, 255, 255, 0.18);
        position: relative;
        overflow-y: auto;
      }

      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
      }

      .app-header {
        text-align: center;
        padding-bottom: 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .app-title {
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }

      .app-subtitle {
        color: #64748b;
        font-size: 14px;
        font-weight: 500;
      }

      .date-box {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        color: white;
        font-weight: 600;
        box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        position: relative;
        overflow: hidden;
      }

      .date-box::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transform: rotate(45deg);
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%) translateY(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) translateY(100%) rotate(45deg);
        }
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        padding: 20px 16px;
        border-radius: 12px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        transition: left 0.5s;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        border-color: rgba(102, 126, 234, 0.3);
      }

      .stat-card:hover::before {
        left: 100%;
      }

      .stat-number {
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: block;
        line-height: 1.2;
      }

      .stat-label {
        font-size: 12px;
        color: #64748b;
        margin-top: 6px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        color: #475569;
        text-decoration: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        font-weight: 600;
        position: relative;
        overflow: hidden;
      }

      .nav-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        transition: left 0.3s ease;
        z-index: -1;
      }

      .nav-item:hover::before,
      .nav-item.active::before {
        left: 0;
      }

      .nav-item:hover,
      .nav-item.active {
        color: white;
        transform: translateX(4px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
      }

      .nav-icon {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .task-count {
        background: rgba(255, 255, 255, 0.25);
        color: currentColor;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        margin-left: auto;
        min-width: 24px;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .main-content {
        flex: 1;
        padding: 32px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        margin: 20px 20px 20px 0;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        overflow-y: auto;
        position: relative;
      }

      .main-content::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
        border-radius: 20px 20px 0 0;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
        padding: 20px 0 24px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .section-title {
        color: #1e293b;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 12px 16px;
        gap: 10px;
        width: 320px;
        transition: all 0.3s ease;
      }

      .search-box:focus-within {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        transform: translateY(-1px);
      }

      .search-input {
        border: none;
        background: transparent;
        outline: none;
        flex: 1;
        color: #1e293b;
        font-size: 14px;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: #94a3b8;
      }

      .add-button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        position: relative;
        overflow: hidden;
      }

      .add-button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transition: all 0.3s ease;
        transform: translate(-50%, -50%);
      }

      .add-button:hover::before {
        width: 100px;
        height: 100px;
      }

      .add-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .kebab-menu {
        position: relative;
      }

      .kebab-button {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 12px;
        cursor: pointer;
        border-radius: 12px;
        color: #64748b;
        font-size: 16px;
        line-height: 1;
        transition: all 0.3s ease;
      }

      .kebab-button:hover {
        background: rgba(255, 255, 255, 0.9);
        color: #475569;
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .kebab-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        min-width: 200px;
        z-index: 100;
        display: none;
        overflow: hidden;
      }

      .kebab-dropdown.active {
        display: block;
        animation: dropdownSlide 0.3s ease;
      }

      @keyframes dropdownSlide {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .kebab-item {
        padding: 14px 18px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .kebab-item:last-child {
        border-bottom: none;
      }

      .kebab-item:hover {
        background: rgba(102, 126, 234, 0.1);
        color: #667eea;
      }

      .kebab-item.danger {
        color: #ef4444;
      }

      .kebab-item.danger:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
      }

      .filters-section {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        align-items: center;
        flex-wrap: wrap;
      }

      .filter-select {
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        color: #475569;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .filter-select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .clear-filters {
        padding: 10px 16px;
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .clear-filters:hover {
        background: rgba(239, 68, 68, 0.2);
        transform: translateY(-1px);
      }

      .tasks-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .task-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 100%;
        background: var(--priority-color, #e2e8f0);
        transition: width 0.3s ease;
      }

      .task-item:hover::before {
        width: 6px;
      }

      .task-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
        border-color: rgba(102, 126, 234, 0.3);
        background: rgba(255, 255, 255, 0.9);
      }

      .task-item.completed {
        opacity: 0.7;
        background: rgba(248, 250, 252, 0.8);
      }

      .task-item.completed .task-title {
        text-decoration: line-through;
        color: #94a3b8;
      }

      .task-item.high-priority {
        --priority-color: #ef4444;
      }

      .task-item.medium-priority {
        --priority-color: #f59e0b;
      }

      .task-item.low-priority {
        --priority-color: #10b981;
      }

      .task-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.3s ease;
        position: relative;
      }

      .task-checkbox::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .task-checkbox.checked::before {
        width: 100%;
        height: 100%;
      }

      .task-checkbox.checked {
        border-color: #10b981;
        color: white;
      }

      .task-checkbox:hover {
        border-color: #10b981;
        transform: scale(1.05);
      }

      .task-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .task-title {
        color: #1e293b;
        font-weight: 600;
        font-size: 16px;
        line-height: 1.4;
      }

      .task-meta {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 13px;
        color: #64748b;
        flex-wrap: wrap;
      }

      .task-priority {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .priority-high {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
      }

      .priority-medium {
        background: rgba(245, 158, 11, 0.1);
        color: #d97706;
      }

      .priority-low {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
      }

      .task-due-date {
        color: #667eea;
        font-weight: 600;
      }

      .task-due-date.overdue {
        color: #ef4444;
      }

      .task-due-date.due-today {
        color: #f59e0b;
      }

      .task-actions {
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .task-item:hover .task-actions {
        opacity: 1;
      }

      .task-action-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .view-btn {
        background: rgba(16, 185, 129, 0.1);
        color: #059669;
      }

      .view-btn:hover {
        background: rgba(16, 185, 129, 0.2);
        transform: scale(1.1);
      }

      .edit-btn {
        background: rgba(59, 130, 246, 0.1);
        color: #2563eb;
      }

      .edit-btn:hover {
        background: rgba(59, 130, 246, 0.2);
        transform: scale(1.1);
      }

      .delete-btn {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
      }

      .delete-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        transform: scale(1.1);
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 32px;
        border-radius: 20px;
        width: 100%;
        max-width: 550px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(31, 38, 135, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }

      .modal.active .modal-content {
        transform: scale(1);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .modal-title {
        color: #1e293b;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .close-btn {
        background: rgba(239, 68, 68, 0.1);
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #ef4444;
        padding: 8px;
        border-radius: 10px;
        transition: all 0.3s ease;
      }

      .close-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        transform: scale(1.1);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        color: #475569;
        font-weight: 600;
        font-size: 14px;
      }

      .form-input,
      .form-textarea,
      .form-select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        color: #1e293b;
        transition: all 0.3s ease;
      }

      .form-input:focus,
      .form-textarea:focus,
      .form-select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        transform: translateY(-1px);
      }

      .form-textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .tags-container {
        margin-bottom: 20px;
      }

      .tags-display {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tag-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(10px);
      }

      .tag-remove {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
      }

      .tag-remove:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .form-actions {
        display: flex;
        gap: 16px;
        justify-content: flex-end;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transition: all 0.3s ease;
        transform: translate(-50%, -50%);
      }

      .btn:hover::before {
        width: 200px;
        height: 200px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.7);
        color: #475569;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-1px);
      }

      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #94a3b8;
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .empty-state-text {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #475569;
      }

      .empty-state-subtext {
        font-size: 16px;
        margin-bottom: 24px;
      }

      .task-detail-content {
        padding: 20px 0;
      }

      .detail-section {
        margin-bottom: 24px;
      }

      .detail-label {
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .detail-value {
        font-size: 16px;
        color: #1e293b;
        line-height: 1.6;
        font-weight: 500;
      }

      .detail-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .detail-tag {
        padding: 6px 12px;
        background: rgba(102, 126, 234, 0.1);
        color: #667eea;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid rgba(102, 126, 234, 0.2);
      }

      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          padding: 20px;
          border-radius: 0 0 20px 20px;
        }

        .main-content {
          margin: 8px;
          padding: 20px;
          border-radius: 20px;
        }

        .header {
          flex-direction: column;
          align-items: stretch;
          gap: 16px;
        }

        .search-box {
          width: 100%;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Icons */
      .home-icon::before {
        content: "🏠";
      }
      .tasks-icon::before {
        content: "📝";
      }
      .completed-icon::before {
        content: "✅";
      }
      .priority-icon::before {
        content: "⭐";
      }
      .search-icon::before {
        content: "🔍";
      }
      .check-icon::before {
        content: "✓";
      }
      .view-icon::before {
        content: "👁";
      }
      .edit-icon::before {
        content: "✏️";
      }
      .delete-icon::before {
        content: "🗑";
      }
      .kebab-icon::before {
        content: "⋮";
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="app-header">
        <h1 class="app-title">Elegant Todo</h1>
        <p class="app-subtitle">Beautiful & Productive</p>
      </div>

      <div class="date-box">
        <div id="currentDate"></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number" id="totalTasks">0</span>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="completedTasks">0</span>
          <div class="stat-label">Done</div>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="pendingTasks">0</span>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="completionRate">0%</span>
          <div class="stat-label">Progress</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-view="all">
          <span class="nav-icon home-icon"></span>
          All Tasks
          <span class="task-count" id="allCount">0</span>
        </a>
        <a href="#" class="nav-item" data-view="pending">
          <span class="nav-icon tasks-icon"></span>
          Pending
          <span class="task-count" id="pendingCount">0</span>
        </a>
        <a href="#" class="nav-item" data-view="completed">
          <span class="nav-icon completed-icon"></span>
          Completed
          <span class="task-count" id="completedCount">0</span>
        </a>
        <a href="#" class="nav-item" data-view="high-priority">
          <span class="nav-icon priority-icon"></span>
          High Priority
          <span class="task-count" id="highPriorityCount">0</span>
        </a>
      </nav>
    </div>

    <div class="main-content">
      <div class="header">
        <h2 class="section-title" id="sectionTitle">All Tasks</h2>
        <div class="header-actions">
          <div class="search-box">
            <span class="search-icon"></span>
            <input
              type="text"
              class="search-input"
              placeholder="Search your tasks..."
              id="searchInput"
            />
          </div>
          <button class="add-button" id="addTaskBtn">✨ Add Task</button>
          <div class="kebab-menu">
            <button class="kebab-button" id="kebabBtn">
              <span class="kebab-icon"></span>
            </button>
            <div class="kebab-dropdown" id="kebabDropdown">
              <div class="kebab-item" onclick="app.markAllComplete()">
                <span>✅</span>
                <span>Mark All Complete</span>
              </div>
              <div class="kebab-item danger" onclick="app.deleteCompleted()">
                <span>🗑</span>
                <span>Delete Completed</span>
              </div>
              <div class="kebab-item danger" onclick="app.clearAllTasks()">
                <span>💥</span>
                <span>Clear All Tasks</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="filters-section">
        <select class="filter-select" id="priorityFilter">
          <option value="">All Priorities</option>
          <option value="high">🔴 High Priority</option>
          <option value="medium">🟡 Medium Priority</option>
          <option value="low">🟢 Low Priority</option>
        </select>
        <select class="filter-select" id="categoryFilter">
          <option value="">All Categories</option>
          <option value="work">💼 Work</option>
          <option value="personal">👤 Personal</option>
          <option value="study">📚 Study</option>
          <option value="health">💪 Health</option>
          <option value="other">📌 Other</option>
        </select>
        <select class="filter-select" id="dueDateFilter">
          <option value="">All Dates</option>
          <option value="overdue">⚠️ Overdue</option>
          <option value="today">📅 Due Today</option>
          <option value="tomorrow">🔜 Due Tomorrow</option>
          <option value="this-week">📆 This Week</option>
        </select>
        <button class="clear-filters" onclick="app.clearFilters()">
          Clear Filters
        </button>
      </div>

      <div class="tasks-list" id="tasksList">
        <!-- Tasks will be dynamically inserted here -->
      </div>

      <div class="empty-state" id="emptyState" style="display: none">
        <div class="empty-state-icon">🎯</div>
        <div class="empty-state-text">No tasks found</div>
        <div class="empty-state-subtext">
          Create your first task and start being productive!
        </div>
      </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div class="modal" id="taskModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="modalTitle">✨ Add New Task</h3>
          <button class="close-btn" onclick="app.closeModal()">×</button>
        </div>
        <form id="taskForm">
          <div class="form-group">
            <label class="form-label" for="taskTitle">📝 Task Title *</label>
            <input
              type="text"
              class="form-input"
              id="taskTitle"
              required
              placeholder="What needs to be done?"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="taskDescription"
              >📄 Description</label
            >
            <textarea
              class="form-textarea"
              id="taskDescription"
              placeholder="Add more details about your task..."
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="taskPriority">⭐ Priority</label>
              <select class="form-select" id="taskPriority">
                <option value="low">🟢 Low Priority</option>
                <option value="medium">🟡 Medium Priority</option>
                <option value="high">🔴 High Priority</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskCategory">📂 Category</label>
              <select class="form-select" id="taskCategory">
                <option value="personal">👤 Personal</option>
                <option value="work">💼 Work</option>
                <option value="study">📚 Study</option>
                <option value="health">💪 Health</option>
                <option value="other">📌 Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="taskDueDate">📅 Due Date</label>
              <input type="date" class="form-input" id="taskDueDate" />
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDueTime">⏰ Due Time</label>
              <input type="time" class="form-input" id="taskDueTime" />
            </div>
          </div>

          <div class="tags-container">
            <label class="form-label">🏷️ Tags</label>
            <div class="tags-display" id="tagsDisplay"></div>
            <input
              type="text"
              class="form-input"
              id="taskTags"
              placeholder="Type a tag and press Enter"
            />
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="app.closeModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="saveBtn">
              💾 Save Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal" id="taskDetailModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">📋 Task Details</h3>
          <button class="close-btn" onclick="app.closeTaskDetail()">×</button>
        </div>
        <div class="task-detail-content" id="taskDetailContent">
          <!-- Task details will be inserted here -->
        </div>
      </div>
    </div>

    <script>
      class ElegantTodoApp {
        constructor() {
          this.tasks = JSON.parse(localStorage.getItem("elegantTasks")) || [];
          this.currentView = "all";
          this.currentEditId = null;
          this.searchQuery = "";
          this.filters = {
            priority: "",
            category: "",
            dueDate: "",
          };
          this.tags = [];

          this.initializeElements();
          this.bindEvents();
          this.updateDate();
          this.renderTasks();
          this.updateStats();
          this.loadSampleData();
        }

        initializeElements() {
          this.tasksList = document.getElementById("tasksList");
          this.searchInput = document.getElementById("searchInput");
          this.addTaskBtn = document.getElementById("addTaskBtn");
          this.taskModal = document.getElementById("taskModal");
          this.taskDetailModal = document.getElementById("taskDetailModal");
          this.taskForm = document.getElementById("taskForm");
          this.emptyState = document.getElementById("emptyState");
          this.sectionTitle = document.getElementById("sectionTitle");
          this.modalTitle = document.getElementById("modalTitle");
          this.saveBtn = document.getElementById("saveBtn");
          this.tagsDisplay = document.getElementById("tagsDisplay");
          this.taskTags = document.getElementById("taskTags");
          this.kebabBtn = document.getElementById("kebabBtn");
          this.kebabDropdown = document.getElementById("kebabDropdown");

          // Filter elements
          this.priorityFilter = document.getElementById("priorityFilter");
          this.categoryFilter = document.getElementById("categoryFilter");
          this.dueDateFilter = document.getElementById("dueDateFilter");
        }

        bindEvents() {
          // Navigation
          document.querySelectorAll(".nav-item").forEach((item) => {
            item.addEventListener("click", (e) => {
              e.preventDefault();
              this.switchView(item.dataset.view);
              this.updateActiveNav(item);
            });
          });

          // Search
          this.searchInput.addEventListener("input", (e) => {
            this.searchQuery = e.target.value.toLowerCase();
            this.renderTasks();
          });

          // Filters
          this.priorityFilter.addEventListener("change", (e) => {
            this.filters.priority = e.target.value;
            this.renderTasks();
          });

          this.categoryFilter.addEventListener("change", (e) => {
            this.filters.category = e.target.value;
            this.renderTasks();
          });

          this.dueDateFilter.addEventListener("change", (e) => {
            this.filters.dueDate = e.target.value;
            this.renderTasks();
          });

          // Kebab menu
          this.kebabBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            this.kebabDropdown.classList.toggle("active");
          });

          // Close kebab menu when clicking outside
          document.addEventListener("click", () => {
            this.kebabDropdown.classList.remove("active");
          });

          // Add task button
          this.addTaskBtn.addEventListener("click", () => {
            this.openModal();
          });

          // Modal events
          this.taskForm.addEventListener("submit", (e) => {
            e.preventDefault();
            this.saveTask();
          });

          // Tags input
          this.taskTags.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              this.addTag();
            }
          });

          // Close modal on backdrop click
          this.taskModal.addEventListener("click", (e) => {
            if (e.target === this.taskModal) {
              this.closeModal();
            }
          });

          this.taskDetailModal.addEventListener("click", (e) => {
            if (e.target === this.taskDetailModal) {
              this.closeTaskDetail();
            }
          });

          // Keyboard shortcuts
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              this.closeModal();
              this.closeTaskDetail();
              this.kebabDropdown.classList.remove("active");
            }
            if (e.ctrlKey && e.key === "n") {
              e.preventDefault();
              this.openModal();
            }
          });
        }

        updateDate() {
          const now = new Date();
          const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          };
          document.getElementById("currentDate").textContent =
            now.toLocaleDateString("en-US", options);
        }

        switchView(view) {
          this.currentView = view;
          this.renderTasks();

          const titles = {
            all: "All Tasks",
            pending: "Pending Tasks",
            completed: "Completed Tasks",
            "high-priority": "High Priority Tasks",
          };

          this.sectionTitle.textContent = titles[view] || "All Tasks";
        }

        updateActiveNav(activeItem) {
          document.querySelectorAll(".nav-item").forEach((item) => {
            item.classList.remove("active");
          });
          activeItem.classList.add("active");
        }

        openModal(task = null) {
          this.currentEditId = task ? task.id : null;
          this.tags = task ? [...(task.tags || [])] : [];

          if (task) {
            this.modalTitle.textContent = "✏️ Edit Task";
            this.saveBtn.innerHTML = "💾 Update Task";
            document.getElementById("taskTitle").value = task.title;
            document.getElementById("taskDescription").value =
              task.description || "";
            document.getElementById("taskPriority").value =
              task.priority || "low";
            document.getElementById("taskCategory").value =
              task.category || "personal";
            document.getElementById("taskDueDate").value = task.dueDate || "";
            document.getElementById("taskDueTime").value = task.dueTime || "";
          } else {
            this.modalTitle.textContent = "✨ Add New Task";
            this.saveBtn.innerHTML = "💾 Save Task";
            this.taskForm.reset();
          }

          this.updateTagsDisplay();
          this.taskModal.classList.add("active");
          document.getElementById("taskTitle").focus();
        }

        closeModal() {
          this.taskModal.classList.remove("active");
          this.currentEditId = null;
          this.tags = [];
          this.taskForm.reset();
          this.updateTagsDisplay();
        }

        addTag() {
          const tagInput = this.taskTags;
          const tagValue = tagInput.value.trim();

          if (tagValue && !this.tags.includes(tagValue)) {
            this.tags.push(tagValue);
            tagInput.value = "";
            this.updateTagsDisplay();
          }
        }

        removeTag(tag) {
          this.tags = this.tags.filter((t) => t !== tag);
          this.updateTagsDisplay();
        }

        updateTagsDisplay() {
          this.tagsDisplay.innerHTML = this.tags
            .map(
              (tag) => `
                    <div class="tag-item">
                        <span>${this.escapeHtml(tag)}</span>
                        <button type="button" class="tag-remove" onclick="app.removeTag('${tag}')">×</button>
                    </div>
                `
            )
            .join("");
        }

        saveTask() {
          const title = document.getElementById("taskTitle").value.trim();
          const description = document
            .getElementById("taskDescription")
            .value.trim();
          const priority = document.getElementById("taskPriority").value;
          const category = document.getElementById("taskCategory").value;
          const dueDate = document.getElementById("taskDueDate").value;
          const dueTime = document.getElementById("taskDueTime").value;

          if (!title) return;

          if (this.currentEditId) {
            // Edit existing task
            const taskIndex = this.tasks.findIndex(
              (t) => t.id === this.currentEditId
            );
            if (taskIndex !== -1) {
              this.tasks[taskIndex] = {
                ...this.tasks[taskIndex],
                title,
                description,
                priority,
                category,
                dueDate,
                dueTime,
                tags: [...this.tags],
                updatedAt: new Date().toISOString(),
              };
            }
          } else {
            // Add new task
            const newTask = {
              id: Date.now().toString(),
              title,
              description,
              priority,
              category,
              dueDate,
              dueTime,
              tags: [...this.tags],
              completed: false,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
            };
            this.tasks.unshift(newTask);
          }

          this.saveTasks();
          this.renderTasks();
          this.updateStats();
          this.closeModal();
        }

        toggleTask(id) {
          const task = this.tasks.find((t) => t.id === id);
          if (task) {
            task.completed = !task.completed;
            task.updatedAt = new Date().toISOString();
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
        }

        deleteTask(id) {
          if (confirm("Are you sure you want to delete this task?")) {
            this.tasks = this.tasks.filter((t) => t.id !== id);
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
        }

        editTask(id) {
          const task = this.tasks.find((t) => t.id === id);
          if (task) {
            this.openModal(task);
          }
        }

        viewTaskDetail(id) {
          const task = this.tasks.find((t) => t.id === id);
          if (task) {
            this.showTaskDetail(task);
          }
        }

        showTaskDetail(task) {
          const content = document.getElementById("taskDetailContent");
          const dueDateTime = this.formatDueDateTime(
            task.dueDate,
            task.dueTime
          );

          content.innerHTML = `
                    <div class="detail-section">
                        <div class="detail-label">Title</div>
                        <div class="detail-value">${this.escapeHtml(
                          task.title
                        )}</div>
                    </div>
                    
                    ${
                      task.description
                        ? `
                        <div class="detail-section">
                            <div class="detail-label">Description</div>
                            <div class="detail-value">${this.escapeHtml(
                              task.description
                            )}</div>
                        </div>
                    `
                        : ""
                    }
                    
                    <div class="detail-section">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">${
                          task.completed ? "✅ Completed" : "⏳ Pending"
                        }</div>
                    </div>
                    
                    <div class="detail-section">
                        <div class="detail-label">Priority</div>
                        <div class="detail-value">
                            <span class="task-priority priority-${
                              task.priority
                            }">${this.getPriorityText(task.priority)}</span>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <div class="detail-label">Category</div>
                        <div class="detail-value">${this.getCategoryText(
                          task.category
                        )}</div>
                    </div>
                    
                    ${
                      dueDateTime
                        ? `
                        <div class="detail-section">
                            <div class="detail-label">Due Date</div>
                            <div class="detail-value">${dueDateTime}</div>
                        </div>
                    `
                        : ""
                    }
                    
                    <div class="detail-section">
                        <div class="detail-label">Created</div>
                        <div class="detail-value">${this.formatDate(
                          task.createdAt
                        )}</div>
                    </div>
                    
                    ${
                      task.tags && task.tags.length > 0
                        ? `
                        <div class="detail-section">
                            <div class="detail-label">Tags</div>
                            <div class="detail-tags">
                                ${task.tags
                                  .map(
                                    (tag) =>
                                      `<span class="detail-tag">${this.escapeHtml(
                                        tag
                                      )}</span>`
                                  )
                                  .join("")}
                            </div>
                        </div>
                    `
                        : ""
                    }
                    
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="app.closeTaskDetail()">Close</button>
                        <button class="btn btn-primary" onclick="app.editTask('${
                          task.id
                        }'); app.closeTaskDetail();">✏️ Edit Task</button>
                    </div>
                `;

          this.taskDetailModal.classList.add("active");
        }

        closeTaskDetail() {
          this.taskDetailModal.classList.remove("active");
        }

        // Bulk operations
        markAllComplete() {
          if (confirm("Mark all tasks as complete?")) {
            this.tasks.forEach((task) => {
              if (!task.completed) {
                task.completed = true;
                task.updatedAt = new Date().toISOString();
              }
            });
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
          this.kebabDropdown.classList.remove("active");
        }

        deleteCompleted() {
          const completedCount = this.tasks.filter((t) => t.completed).length;
          if (completedCount === 0) {
            alert("No completed tasks to delete.");
            this.kebabDropdown.classList.remove("active");
            return;
          }

          if (
            confirm(
              `Delete ${completedCount} completed task${
                completedCount > 1 ? "s" : ""
              }?`
            )
          ) {
            this.tasks = this.tasks.filter((t) => !t.completed);
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
          this.kebabDropdown.classList.remove("active");
        }

        clearAllTasks() {
          if (this.tasks.length === 0) {
            alert("No tasks to delete.");
            this.kebabDropdown.classList.remove("active");
            return;
          }

          if (
            confirm(
              `Are you sure you want to delete all ${this.tasks.length} tasks? This cannot be undone!`
            )
          ) {
            this.tasks = [];
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
          this.kebabDropdown.classList.remove("active");
        }

        clearFilters() {
          this.filters = { priority: "", category: "", dueDate: "" };
          this.priorityFilter.value = "";
          this.categoryFilter.value = "";
          this.dueDateFilter.value = "";
          this.renderTasks();
        }

        getFilteredTasks() {
          let filtered = this.tasks;

          // Filter by view
          switch (this.currentView) {
            case "pending":
              filtered = filtered.filter((t) => !t.completed);
              break;
            case "completed":
              filtered = filtered.filter((t) => t.completed);
              break;
            case "high-priority":
              filtered = filtered.filter((t) => t.priority === "high");
              break;
          }

          // Filter by priority
          if (this.filters.priority) {
            filtered = filtered.filter(
              (t) => t.priority === this.filters.priority
            );
          }

          // Filter by category
          if (this.filters.category) {
            filtered = filtered.filter(
              (t) => t.category === this.filters.category
            );
          }

          // Filter by due date
          if (this.filters.dueDate) {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const weekFromNow = new Date(today);
            weekFromNow.setDate(weekFromNow.getDate() + 7);

            filtered = filtered.filter((t) => {
              if (!t.dueDate) return false;
              const dueDate = new Date(t.dueDate);

              switch (this.filters.dueDate) {
                case "overdue":
                  return dueDate < today && !t.completed;
                case "today":
                  return dueDate.toDateString() === today.toDateString();
                case "tomorrow":
                  return dueDate.toDateString() === tomorrow.toDateString();
                case "this-week":
                  return dueDate >= today && dueDate <= weekFromNow;
                default:
                  return true;
              }
            });
          }

          // Filter by search query
          if (this.searchQuery) {
            filtered = filtered.filter(
              (t) =>
                t.title.toLowerCase().includes(this.searchQuery) ||
                (t.description &&
                  t.description.toLowerCase().includes(this.searchQuery)) ||
                (t.tags &&
                  t.tags.some((tag) =>
                    tag.toLowerCase().includes(this.searchQuery)
                  ))
            );
          }

          return filtered;
        }

        renderTasks() {
          const filteredTasks = this.getFilteredTasks();

          if (filteredTasks.length === 0) {
            this.tasksList.style.display = "none";
            this.emptyState.style.display = "block";
            return;
          }

          this.tasksList.style.display = "flex";
          this.emptyState.style.display = "none";

          this.tasksList.innerHTML = filteredTasks
            .map((task) => {
              const dueStatus = this.getDueStatus(task.dueDate);
              const dueDateTime = this.formatDueDateTime(
                task.dueDate,
                task.dueTime
              );

              return `
                        <div class="task-item ${
                          task.completed ? "completed" : ""
                        } ${task.priority}-priority" data-id="${task.id}">
                            <div class="task-checkbox ${
                              task.completed ? "checked" : ""
                            }" onclick="app.toggleTask('${task.id}')">
                                ${
                                  task.completed
                                    ? '<span class="check-icon"></span>'
                                    : ""
                                }
                            </div>
                            <div class="task-content">
                                <div class="task-title">${this.escapeHtml(
                                  task.title
                                )}</div>
                                <div class="task-meta">
                                    <span class="task-priority priority-${
                                      task.priority
                                    }">${this.getPriorityText(
                task.priority
              )}</span>
                                    <span>${this.getCategoryText(
                                      task.category
                                    )}</span>
                                    ${
                                      dueDateTime
                                        ? `<span class="task-due-date ${dueStatus}">${dueDateTime}</span>`
                                        : ""
                                    }
                                    <span>${this.formatDate(
                                      task.createdAt
                                    )}</span>
                                </div>
                            </div>
                            <div class="task-actions">
                                <button class="task-action-btn view-btn" onclick="app.viewTaskDetail('${
                                  task.id
                                }')" title="View Details">
                                    <span class="view-icon"></span>
                                </button>
                                <button class="task-action-btn edit-btn" onclick="app.editTask('${
                                  task.id
                                }')" title="Edit">
                                    <span class="edit-icon"></span>
                                </button>
                                <button class="task-action-btn delete-btn" onclick="app.deleteTask('${
                                  task.id
                                }')" title="Delete">
                                    <span class="delete-icon"></span>
                                </button>
                            </div>
                        </div>
                    `;
            })
            .join("");
        }

        updateStats() {
          const total = this.tasks.length;
          const completed = this.tasks.filter((t) => t.completed).length;
          const pending = total - completed;
          const highPriority = this.tasks.filter(
            (t) => t.priority === "high"
          ).length;
          const completionRate =
            total > 0 ? Math.round((completed / total) * 100) : 0;

          document.getElementById("totalTasks").textContent = total;
          document.getElementById("completedTasks").textContent = completed;
          document.getElementById("pendingTasks").textContent = pending;
          document.getElementById(
            "completionRate"
          ).textContent = `${completionRate}%`;

          // Update navigation counts
          document.getElementById("allCount").textContent = total;
          document.getElementById("pendingCount").textContent = pending;
          document.getElementById("completedCount").textContent = completed;
          document.getElementById("highPriorityCount").textContent =
            highPriority;
        }

        getDueStatus(dueDate) {
          if (!dueDate) return "";

          const today = new Date();
          const due = new Date(dueDate);
          const diffTime = due - today;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

          if (diffDays < 0) return "overdue";
          if (diffDays === 0) return "due-today";
          return "";
        }

        formatDueDateTime(dueDate, dueTime) {
          if (!dueDate) return "";

          const date = new Date(dueDate);
          let formatted = date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          });

          if (dueTime) {
            const time = new Date(`2000-01-01T${dueTime}`);
            formatted += ` ${time.toLocaleTimeString("en-US", {
              hour: "numeric",
              minute: "2-digit",
              hour12: true,
            })}`;
          }

          return formatted;
        }

        getPriorityText(priority) {
          const priorities = {
            high: "🔴 High",
            medium: "🟡 Medium",
            low: "🟢 Low",
          };
          return priorities[priority] || "🟢 Low";
        }

        getCategoryText(category) {
          const categories = {
            work: "💼 Work",
            personal: "👤 Personal",
            study: "📚 Study",
            health: "💪 Health",
            other: "📌 Other",
          };
          return categories[category] || "📌 Other";
        }

        formatDate(dateString) {
          const date = new Date(dateString);
          const now = new Date();
          const diffTime = Math.abs(now - date);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

          if (diffDays === 1) return "Today";
          if (diffDays === 2) return "Yesterday";
          if (diffDays <= 7) return `${diffDays} days ago`;

          return date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          });
        }

        escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text;
          return div.innerHTML;
        }

        saveTasks() {
          localStorage.setItem("elegantTasks", JSON.stringify(this.tasks));
        }

        loadSampleData() {
          if (this.tasks.length === 0) {
            const sampleTasks = [
              {
                id: "1",
                title: "Complete project presentation",
                description:
                  "Prepare slides and practice for the quarterly review meeting",
                priority: "high",
                category: "work",
                dueDate: new Date(Date.now() + 86400000)
                  .toISOString()
                  .split("T")[0],
                dueTime: "14:00",
                tags: ["presentation", "quarterly"],
                completed: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
              },
              {
                id: "2",
                title: "Buy groceries for dinner",
                description:
                  "Get fresh vegetables, chicken, and ingredients for pasta",
                priority: "medium",
                category: "personal",
                dueDate: new Date().toISOString().split("T")[0],
                dueTime: "18:00",
                tags: ["shopping", "food"],
                completed: true,
                createdAt: new Date(Date.now() - 86400000).toISOString(),
                updatedAt: new Date().toISOString(),
              },
              {
                id: "3",
                title: "Study JavaScript fundamentals",
                description:
                  "Review async/await, promises, and modern ES6+ features",
                priority: "medium",
                category: "study",
                dueDate: new Date(Date.now() + 172800000)
                  .toISOString()
                  .split("T")[0],
                dueTime: "20:00",
                tags: ["javascript", "learning", "programming"],
                completed: false,
                createdAt: new Date(Date.now() - 172800000).toISOString(),
                updatedAt: new Date().toISOString(),
              },
              {
                id: "4",
                title: "Morning workout routine",
                description: "45 minutes of cardio and strength training",
                priority: "low",
                category: "health",
                dueDate: new Date().toISOString().split("T")[0],
                dueTime: "07:00",
                tags: ["fitness", "health", "morning"],
                completed: false,
                createdAt: new Date(Date.now() - 259200000).toISOString(),
                updatedAt: new Date().toISOString(),
              },
            ];

            this.tasks = sampleTasks;
            this.saveTasks();
            this.renderTasks();
            this.updateStats();
          }
        }
      }

      // Initialize the app
      const app = new ElegantTodoApp();
    </script>
  </body>
</html>
